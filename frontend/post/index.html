<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Új eszköz létrehozása</title>
</head>
<body>

    <div class="container py-5">

        <h1 class="mb-4">Új eszközök létrehozása</h1>

        <form id="eszkozForm">

            <div class=""wor g-3>

                <div class="col-md-6">

                    <label class="form-label">Név</label>
                    <input id="nev" class="form-control"  required>
                </div> 


                <div class="col-md-6">

                    <label class="form-label">leltári szám</label>
                    <input id="leltariSzam" class="form-control" required>
                </div> 


                <div class="col-md-4">

                    <label class="form-label">Kategoria</label>
                    <input id="kategoria" class="form-control"  required>
                </div> 


                <div class="col-md-4">

                    <label class="form-label">Gyártó</label>
                    <input id="gyarto" class="form-control"  required>
                </div> 


                <div class="col-md-4">

                    <label class="form-label">Modell</label>
                    <input id="modell" class="form-control"  required>
                </div> 

                <div class="col-md-4">

                    <label class="form-label">Terem</label>
                    <input id="terem" class="form-control"  required>
                </div> 

                <div class="col-md-4">

                    <label class="form-label">Állapot</label>
                    <input id="allapot" class="form-control"  required>
                </div> 

                <div class="col-md-4">

                    <label class="form-label">Berendezési ár</label>
                    <input id="berendezesiAr" class="form-control" type="number" required>
                </div> 

                <div class="col-md-4">

                    <label class="form-label">Beszerzési dátuma</label>
                    <input id="beszerzesDatum" class="form-control" type="date" required>
                </div> 


                <div class="col-md-4">
                    <div class="form-check mt-4">
                        <label class="form-check">Használatban van</label>
                        <input id="hasznalatbanVan" class="form-check-input" type="checkbox" >
                       
                    </div>
                </div> 


                <div class="col-md-4">
                    <div class="form-check mt-4">
                        <label class="form-check">Kölcsönözhető</label>
                        <input id="kolcsonozheto" class="form-check-input" type="checkbox" >
                        
                    </div>

                    
                </div> 
            </div>

            <button class="btn btn-warning mt-4" type="submit">LÉtrehozás</button>


        </form>

        <div id="üzenet" class="mt-3">...</div>
h

    </div>

    

    <script src="script.js"></script>
    
</body>
</html>
